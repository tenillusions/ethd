name: Fetch Validator Queue Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python .github/scripts/fetch_queue.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue-data.json
          git diff --cached --quiet || git commit -m "Update queue data"
          git push
      - name: Trigger Pages deploy
        run: gh workflow run pages.yml -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
